services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gavve
      POSTGRES_PASSWORD: gavve
      POSTGRES_DB: gavve_dev
    ports:
      - '5432:5432'
    volumes:
      - gavve-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gavve']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gavve-postgres-data:
